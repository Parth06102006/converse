[project]
name = "converse-tts"
version = "0.1.0"
description = "Native Edge-TTS Neural Voice Synthesis Engine for Converse"
readme = "README.md"
authors = [
    { name = "Converse Team", email = "dev@converse.local" }
]
requires-python = ">=3.12"
dependencies = [
    "edge-tts>=7.2.8",
    "miniaudio>=1.71",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]
