[project]
name = "asr"
version = "0.1.0"
description = "Streaming Automatic Speech Recognition and VAD Engine"
readme = "README.md"
authors = [
    { name = "Ashwani", email = "ashwani@converse.local" }
]
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.0.0",
    "numpy>=1.26.0",
    "faster-whisper>=1.2.1",
    "onnxruntime>=1.30.0",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
    "amazon-transcribe>=0.6.4",
    "opencv-contrib-python>=5.0.0.93",
    "edge-tts>=7.2.8",
    "miniaudio>=1.71",
]

[project.scripts]
asr = "asr:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]
